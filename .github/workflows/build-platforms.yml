name: Build and release five platform packages
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish
        required: true
        default: v0.5.1-opt.23
      artifact_run_id:
        description: Reuse artifacts from a completed run; leave empty to build
        default: ''
      build_macos:
        description: Build macOS arm64
        type: boolean
        default: true
      linux_families:
        description: Linux families as a JSON array
        default: '["debian","fedora","arch"]'
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    if: ${{ !inputs.artifact_run_id }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Prepare original assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python work/fetch_release_assets.py
      - name: Build complete Windows package
        shell: pwsh
        run: ./build-windows.ps1 -Zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist-windows/*.zip
          if-no-files-found: error
  macos:
    if: ${{ inputs.build_macos && !inputs.artifact_run_id }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Prepare assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python work/fetch_release_assets.py
      - name: Build decoder and application
        run: |
          test "$(uname -m)" = arm64
          brew list pkgconf >/dev/null 2>&1 || brew install pkgconf
          python -m pip install -r requirements-build.txt -r requirements-macos.txt
          python work/build_minimal_ffmpeg.py
          python work/build_macos.py --ffmpeg .build/ffmpeg/darwin-arm64/bin/ffmpeg
          python work/archive_platform.py --platform macos --directory dist-macos/BailongPet.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist-macos/*.zip
  linux:
    if: ${{ !inputs.artifact_run_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(inputs.linux_families) }}
    container: ${{ matrix.family == 'debian' && 'python:3.13-slim-bookworm' || matrix.family == 'fedora' && 'fedora:44' || 'archlinux:base' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools and desktop libraries
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          case "$FAMILY" in
            debian)
              apt-get update
              apt-get install -y git build-essential binutils pkg-config nasm perl unzip pulseaudio-utils libgl1 libegl1 libfontconfig1 libdbus-1-3 libx11-xcb1 libxrender1 libxext6 libsm6 libice6 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libxkbcommon-x11-0 fonts-noto-cjk
              ;;
            fedora)
              dnf install -y git uv gcc gcc-c++ make binutils pkgconf-pkg-config nasm perl unzip tar xz pulseaudio-utils libglvnd-glx libglvnd-egl fontconfig dbus-libs libX11-xcb libXrender libXext libSM libICE libxcb xcb-util-cursor xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil libxkbcommon-x11 google-noto-sans-cjk-fonts
              ;;
            arch)
              pacman -Syu --noconfirm git uv base-devel binutils pkgconf nasm perl unzip libpulse libglvnd fontconfig dbus libx11 libxrender libxext libsm libice libxcb xcb-util-cursor xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil libxkbcommon-x11 noto-fonts-cjk
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - name: Select Python 3.13
        if: matrix.family != 'debian'
        run: |
          uv python install 3.13
          uv venv --python 3.13 --seed .build/venvs/ci-bootstrap
      - name: Prepare assets
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHON: ${{ matrix.family == 'debian' && 'python3' || '.build/venvs/ci-bootstrap/bin/python3.13' }}
        run: '"$PYTHON" work/fetch_release_assets.py'
      - name: Build decoder and application
        env:
          PYTHON: ${{ matrix.family == 'debian' && 'python3' || '.build/venvs/ci-bootstrap/bin/python3.13' }}
          FAMILY: ${{ matrix.family }}
        run: |
          "$PYTHON" -m venv .build/venvs/ci
          .build/venvs/ci/bin/python -m pip install -r requirements-build.txt
          .build/venvs/ci/bin/python work/build_minimal_ffmpeg.py
          .build/venvs/ci/bin/python work/build_linux.py --family "$FAMILY" --ffmpeg .build/ffmpeg/linux-x86_64/bin/ffmpeg
          .build/venvs/ci/bin/python work/archive_platform.py --platform linux --family "$FAMILY" --directory "dist-linux/$FAMILY-x86_64/BailongPet"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.family }}-x86_64
          path: dist-linux/*/*.tar.gz
          if-no-files-found: error
  publish:
    needs: [windows, macos, linux]
    if: ${{ always() && !cancelled() && (inputs.artifact_run_id != '' || (needs.windows.result == 'success' && needs.macos.result == 'success' && needs.linux.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Publish complete packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p .build
          python - <<'PY'
          import os
          from pathlib import Path
          text = Path('work/platform_release_notes.md').read_text(encoding='utf-8')
          text = text.replace('{{TAG}}', os.environ['RELEASE_TAG'])
          text = text.replace('{{REPO}}', os.environ['GH_REPO'])
          Path('.build/release-notes.md').write_text(text, encoding='utf-8')
          PY
          mapfile -d '' package_files < <(find packages -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0)
          gh release create "$RELEASE_TAG" "${package_files[@]}" --verify-tag --title "$RELEASE_TAG · Windows / macOS / Linux" --notes-file .build/release-notes.md
